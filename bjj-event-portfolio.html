<!DOCTYPE html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alfa Sport Evenementen — Brazilian Jiu-Jitsu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   APEX GRAPPLING SYSTEM — jetons repris du DESIGN.md de l'export Stitch
   ========================================================================== */
:root{
  --surface:#121414;
  --lowest:#0c0f0f; --low:#1a1c1c; --container:#1e2020; --high:#282a2b; --highest:#333535; --bright:#38393a;
  --on-surface:#e2e2e2; --on-variant:#c6c9ab;
  --outline:#909378; --outline-variant:#464932;
  --neon:#d4f000; --neon-dim:#bad200; --on-neon:#2d3400;
  --orange:#ff571a; --orange-soft:#ffb59e;
  --hair:rgba(255,255,255,.1);
  --hair-s:rgba(255,255,255,.18);
  --max:1280px;
  --mx:clamp(1rem,4vw,2.5rem);          /* margin-mobile → margin-desktop */
  --stack-xl:clamp(3.5rem,8vw,8rem);
  --stack-lg:clamp(2rem,4.5vw,4rem);
  --stack-md:2rem;
  --e:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--surface);color:var(--on-surface);
  font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px;line-height:24px;font-weight:400;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
input{font:inherit}
:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
::selection{background:var(--neon-dim);color:var(--surface)}

/* ---- échelle typographique du système ---- */
.disp{font-family:"Archivo Narrow",Arial Narrow,sans-serif;font-weight:700;text-transform:uppercase;
  font-size:clamp(2.7rem,7.2vw,5rem);line-height:.92;letter-spacing:-.035em}
.h-lg{font-family:"Archivo Narrow",sans-serif;font-weight:600;text-transform:uppercase;
  font-size:clamp(1.6rem,3.4vw,2.5rem);line-height:1.15;letter-spacing:-.015em}
.h-md{font-family:"Archivo Narrow",sans-serif;font-weight:600;text-transform:uppercase;font-size:1.5rem;line-height:2rem}
.body-lg{font-size:1.125rem;line-height:1.75rem;color:var(--on-variant)}
.lab{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:500;font-size:.75rem;line-height:1rem;
  letter-spacing:.1em;text-transform:uppercase}
.mono{font-family:"JetBrains Mono",monospace;font-weight:500;font-variant-numeric:tabular-nums}
.dim{color:var(--on-variant)}
.faint{color:var(--outline)}

/* ---- boutons du système : angles à 0, néon plein / contour néon ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;padding:.95rem 1.6rem;
  font-family:"Archivo Narrow",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.95rem;
  background:var(--neon);color:var(--on-neon);border:1px solid var(--neon);transition:.35s var(--e);white-space:nowrap}
.btn:hover{background:var(--neon-dim);border-color:var(--neon-dim);translate:0 -2px}
.btn-o{background:transparent;color:var(--neon)}
.btn-o:hover{background:rgba(212,240,0,.1);color:var(--neon);translate:0 -2px}
.btn-g{background:transparent;color:var(--on-surface);border-color:var(--hair-s)}
.btn-g:hover{background:var(--high);border-color:var(--on-variant)}
.btn-sm{padding:.6rem 1rem;font-size:.82rem}
.pill{display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .7rem;border:1px solid var(--hair-s);
  font-family:"JetBrains Mono",monospace;font-weight:500;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase}
.pill-neon{border-color:var(--neon);color:var(--neon)}
.pill-live{background:var(--orange);border-color:var(--orange);color:#fff}
.dot{width:7px;height:7px;border-radius:999px;background:currentColor;flex:0 0 auto}
.dot.p{animation:pulse 1.8s cubic-bezier(.4,0,.6,1) infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 currentColor}70%{opacity:.5;box-shadow:0 0 0 6px transparent}}

/* ==========================================================================
   coque + aperçu desktop/mobile
   ========================================================================== */
#app{container-type:inline-size;container-name:app;min-height:100vh;display:flex;flex-direction:column;background:var(--surface)}
.wrap{max-width:var(--max);margin-inline:auto;width:100%;padding-inline:var(--mx)}
.pbar{display:none}
body.mob{background:#000}
body.mob #stage{display:grid;place-items:center;min-height:100vh;padding:24px 14px 78px;
  background:radial-gradient(760px 500px at 50% 0,rgba(212,240,0,.09),transparent 70%),#000}
body.mob #app{width:392px;height:min(834px,86vh);overflow:hidden auto;border:1px solid var(--hair-s);
  box-shadow:0 40px 90px -28px #000;scrollbar-width:none;overscroll-behavior:contain;min-height:0}
body.mob #app::-webkit-scrollbar{display:none}
body.mob .pbar{display:flex;position:sticky;top:0;z-index:80;justify-content:space-between;
  padding:12px 22px 6px;background:var(--surface);font-size:.62rem;color:var(--outline)}
.switch{position:fixed;left:50%;bottom:16px;translate:-50% 0;z-index:400;display:flex;
  background:rgba(18,20,20,.86);backdrop-filter:blur(24px);border:1px solid var(--hair)}
.switch button{padding:.55rem 1.1rem;font-family:"JetBrains Mono",monospace;font-size:.66rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--outline);transition:.3s}
.switch button[aria-pressed=true]{background:var(--neon);color:var(--on-neon)}

/* ---- navigation : barre fixe, fort flou d'arrière-plan ---- */
.nav{position:sticky;top:0;z-index:60;background:rgba(18,20,20,.72);backdrop-filter:blur(28px) saturate(1.2);
  border-bottom:1px solid var(--hair)}
.nav-in{display:flex;align-items:center;gap:clamp(.6rem,2vw,2.5rem);height:68px;max-width:var(--max);
  margin-inline:auto;padding-inline:var(--mx)}
.brand{display:flex;align-items:center;gap:.65rem;margin-right:auto}
.brand .k{width:26px;height:26px;background:var(--neon);display:grid;place-items:center;flex:0 0 auto}
.brand .k i{width:9px;height:9px;border:2.5px solid var(--on-neon);border-radius:50%;display:block}
.brand b{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:1.18rem;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.brand span{display:block;font-family:"JetBrains Mono",monospace;font-size:.56rem;letter-spacing:.16em;color:var(--outline);margin-top:2px}
.nav-links{display:flex;gap:clamp(.5rem,1.6vw,1.7rem)}
.nav-links a{font-family:"Archivo Narrow",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
  font-size:.95rem;color:var(--on-variant);padding:.35rem 0;border-bottom:2px solid transparent;transition:.3s var(--e)}
.nav-links a:hover{color:var(--on-surface)}
.nav-links a.on{color:var(--neon);border-color:var(--neon)}
.lang{display:flex;gap:.35rem;padding-left:1rem;border-left:1px solid var(--hair)}
.lang button{font-family:"JetBrains Mono",monospace;font-size:.66rem;letter-spacing:.08em;color:var(--outline);padding:.2rem .3rem;transition:.3s}
.lang button[aria-current=true]{color:var(--neon)}
.burger{display:none;width:34px;height:34px;place-items:center;border:1px solid var(--hair)}
.burger i{width:15px;height:1.5px;background:var(--on-surface);display:block;margin:3px 0}
.mnav{display:none;border-bottom:1px solid var(--hair);background:var(--low)}
.mnav.open{display:block}
.mnav a{display:block;padding:1rem var(--mx);border-bottom:1px solid var(--hair);
  font-family:"Archivo Narrow",sans-serif;font-weight:600;text-transform:uppercase;font-size:1.3rem}
.mnav a:last-child{border:0}

/* apparitions */
.rv{opacity:0;translate:0 20px}
.rv.in{opacity:1;translate:0;transition:opacity .8s var(--e),translate .8s var(--e);transition-delay:var(--d,0ms)}
@supports (animation-timeline:view()){
  .rv{opacity:1;translate:0;animation:rvA linear both;animation-timeline:view();animation-range:entry 0% cover 24%}
  @keyframes rvA{from{opacity:0;translate:0 20px}}
}

/* ==========================================================================
   ACCUEIL — hero cinématique
   ========================================================================== */
.hero{position:relative;min-height:min(86vh,760px);display:flex;align-items:flex-end;overflow:hidden;isolation:isolate}
.hero-bg{position:absolute;inset:0;z-index:-2}
.hero-bg img{width:100%;height:100%;object-fit:cover;opacity:.55;filter:none}
@supports (animation-timeline:view()){
  .hero-bg img{animation:kb linear both;animation-timeline:view();animation-range:entry 0% exit 100%}
  @keyframes kb{from{scale:1.12}to{scale:1}}
}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(to top,var(--surface) 2%,rgba(18,20,20,.82) 34%,rgba(18,20,20,.25) 72%),
             linear-gradient(90deg,rgba(18,20,20,.9),rgba(18,20,20,.15) 62%)}
.hero-in{padding-block:clamp(5rem,12vw,7rem) clamp(1.8rem,4vw,3rem)}
.hero .kick{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:1.4rem}
.hero .pre{font-family:"Archivo Narrow",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
  font-size:clamp(1rem,2vw,1.5rem);color:var(--on-variant)}
.hero h1{margin-top:.15em;max-width:22ch}
.hero .body-lg{margin-top:1.3rem;max-width:52ch}
.hero .acts{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:2rem}
.scroll-cue{display:flex;align-items:center;gap:.6rem;margin-top:clamp(1.6rem,4vw,3rem);color:var(--outline)}
.scroll-cue i{display:block;width:1px;height:26px;background:linear-gradient(var(--outline),transparent);animation:drop 2.4s var(--e) infinite}
@keyframes drop{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}
  51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* bandeau de chiffres */
.stats{border-block:1px solid var(--hair);background:var(--lowest)}
.stats-in{display:grid;grid-template-columns:repeat(4,1fr);max-width:var(--max);margin-inline:auto}
.stat{padding:clamp(1.3rem,2.6vw,2.2rem) var(--mx);border-left:1px solid var(--hair)}
.stat:first-child{border-left:0}
.stat span{display:block;color:var(--outline);margin-bottom:.5rem}
.stat b{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:clamp(1.5rem,3.4vw,2.6rem);
  line-height:1;letter-spacing:-.02em;display:block}
.stat.neon b{color:var(--neon)}

/* section générique */
.sect{padding-block:var(--stack-xl)}
.sect.sm{padding-block:var(--stack-lg)}
.shead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1.2rem;margin-bottom:var(--stack-md)}
.shead .lab{color:var(--neon)}
.rule{height:1px;background:var(--hair)}

/* événement en vedette */
.feat{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(1.2rem,3vw,3rem);align-items:center}
.feat .ph{position:relative;aspect-ratio:3/4;overflow:hidden;border:1px solid var(--hair)}
.feat .ph img{width:100%;height:100%;object-fit:cover;transition:filter .8s var(--e),scale 1.2s var(--e)}
.feat .ph:hover img{filter:brightness(1.22);scale:1.03}
.feat .ph .tagline{position:absolute;inset:auto 0 0 0;padding:1rem;background:linear-gradient(to top,rgba(12,15,15,.95),transparent)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:1rem;align-items:center;margin:1.6rem 0;
  padding-block:1.2rem;border-block:1px solid var(--hair)}
.vs .side span{display:block;color:var(--outline);margin-bottom:.3rem}
.vs .side b{font-family:"Archivo Narrow",sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(1rem,2vw,1.45rem);line-height:1.05;display:block}
.vs .mid{font-family:"Archivo Narrow",sans-serif;font-weight:700;color:var(--neon);font-size:1.3rem}
.vs .side.r{text-align:right}

/* cartes d'information */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--hair);border:1px solid var(--hair)}
.card{background:var(--container);padding:clamp(1.2rem,2.4vw,1.9rem);transition:background .4s var(--e)}
.card:hover{background:var(--high)}
.card .ic{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--outline-variant);color:var(--neon);margin-bottom:1rem}
.card .ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6}
.card h3{font-family:"Archivo Narrow",sans-serif;font-weight:600;text-transform:uppercase;font-size:1.1rem;letter-spacing:.02em;margin-bottom:.4rem}
.card p{font-size:.94rem;color:var(--on-variant)}

/* bloc diffusion */
.bc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(1.4rem,3vw,3.4rem);align-items:center;
  background:var(--lowest);border:1px solid var(--hair);padding:clamp(1.4rem,3vw,3rem)}
.bc .chans{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.4rem}
.bc .k{padding:.5rem .9rem;border:1px solid var(--hair-s);font-family:"Archivo Narrow",sans-serif;font-weight:600;
  text-transform:uppercase;letter-spacing:.06em;font-size:.9rem;color:var(--on-variant);transition:.35s var(--e)}
.bc .k:hover{border-color:var(--neon);color:var(--neon)}

/* ==========================================================================
   CALENDRIER
   ========================================================================== */
.filters{display:flex;flex-wrap:wrap;gap:.9rem;align-items:center;padding-block:1rem;
  border-block:1px solid var(--hair);margin-bottom:var(--stack-md)}
.filters .g{display:flex;gap:.4rem;flex-wrap:wrap}
.filters .lab{color:var(--outline);display:flex;align-items:center;gap:.5rem}
.filters .lab svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6}
.fbtn{padding:.4rem .8rem;border:1px solid var(--hair);font-family:"JetBrains Mono",monospace;font-size:.68rem;
  letter-spacing:.08em;text-transform:uppercase;color:var(--on-variant);transition:.3s var(--e)}
.fbtn:hover{border-color:var(--outline)}
.fbtn[aria-pressed=true]{background:var(--neon);border-color:var(--neon);color:var(--on-neon)}
.evs{display:grid;gap:1px;background:var(--hair);border:1px solid var(--hair)}
.ev{display:grid;grid-template-columns:210px minmax(0,1fr) 260px 190px 44px;align-items:center;gap:1.5rem;
  background:var(--lowest);padding:clamp(1.1rem,2.2vw,1.6rem) clamp(1rem,2vw,1.6rem);
  text-align:left;width:100%;position:relative;transition:background .4s var(--e),padding-left .4s var(--e)}
.ev:nth-child(even){background:var(--container)}
.ev:hover{background:var(--high)}
.ev .d{color:var(--neon)}
.ev .city{font-family:"Archivo Narrow",sans-serif;font-weight:700;text-transform:uppercase;
  font-size:clamp(1.3rem,2.6vw,2rem);line-height:1;letter-spacing:-.02em}
.ev .kind{display:block;color:var(--on-variant);margin-top:.35rem;font-size:.92rem}
.ev .ven span{display:block;color:var(--outline);margin-bottom:.25rem}
.ev .ven b{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:.78rem;letter-spacing:.04em;line-height:1.4;display:block}
.ev .st{justify-self:start}
.ev .ar{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--hair-s);color:var(--on-variant);transition:.35s var(--e)}
.ev:hover .ar{background:var(--neon);border-color:var(--neon);color:var(--on-neon)}
.ev .ar svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8}
.st-open{color:var(--neon);border-color:rgba(212,240,0,.45)}
.st-fast{color:var(--orange);border-color:rgba(255,87,26,.5)}
.st-wait{color:var(--on-variant)}
.st-live{background:var(--orange);border-color:var(--orange);color:#fff}

/* newsletter */
.nl{border:1px solid var(--hair);background:var(--lowest);padding:clamp(1.5rem,4vw,3.4rem);
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:clamp(1.2rem,3vw,3rem);align-items:center}
.nl form{display:flex;gap:.6rem}
.nl input{flex:1;min-width:0;background:transparent;border:1px solid var(--hair-s);padding:.9rem 1rem;color:var(--on-surface)}
.nl input:focus{outline:none;border-color:var(--neon);box-shadow:0 0 0 3px rgba(212,240,0,.12)}
.nl .ok{color:var(--neon);font-family:"JetBrains Mono",monospace;font-size:.8rem;letter-spacing:.06em}

/* ==========================================================================
   DIRECT
   ========================================================================== */
.live{display:grid;grid-template-columns:minmax(0,1fr) clamp(280px,26vw,380px);gap:clamp(1rem,2vw,1.5rem);align-items:start}
.player{position:relative;aspect-ratio:16/9;background:#000;border:1px solid var(--hair);overflow:hidden;cursor:pointer}
.player video{width:100%;height:100%;object-fit:cover;opacity:.7;transition:.6s var(--e);display:block;background:#000}
.player.on video{opacity:1}
.player.on{cursor:default}
.player.on .go,.player.on .hud,.player.on .bar{opacity:0;pointer-events:none;transition:opacity .3s}
.player:hover video{opacity:.9}
.credit{color:var(--outline);margin-top:.6rem;line-height:1.5}
.credit a{color:var(--out);border-bottom:1px solid var(--hair-s)}
.credit a:hover{color:var(--neon)}
.player .go{position:absolute;left:50%;top:50%;translate:-50% -50%;width:72px;height:72px;background:var(--neon);
  display:grid;place-items:center;transition:.35s var(--e)}
.player:hover .go{scale:1.06;background:var(--neon-dim)}
.player .go::before{content:"";width:0;height:0;border-left:19px solid var(--on-neon);border-block:12px solid transparent;margin-left:5px}
.player .hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:.6rem;padding:1rem;z-index:3;
  background:linear-gradient(to bottom,rgba(12,15,15,.85),transparent)}
.player .hud .vw{margin-left:auto;display:flex;align-items:center;gap:.4rem;color:var(--on-variant)}
.player .hud .vw svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6}
.player .bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:.9rem;padding:.8rem 1rem;z-index:3;
  background:linear-gradient(to top,rgba(12,15,15,.9),transparent);color:var(--on-variant)}
.player .bar .t{color:var(--orange)}
.player .bar .sp{margin-left:auto;display:flex;gap:.8rem}
.player .bar svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6}
.feeds{border:1px solid var(--hair)}
.feeds h3{padding:.9rem 1rem;border-bottom:1px solid var(--hair);background:var(--lowest)}
.feed{display:flex;align-items:center;gap:.9rem;width:100%;text-align:left;padding:.9rem 1rem;
  border-bottom:1px solid var(--hair);transition:.35s var(--e);background:var(--container)}
.feed:last-child{border-bottom:0}
.feed:hover{background:var(--high)}
.feed[aria-current=true]{background:var(--high);box-shadow:inset 3px 0 0 var(--neon)}
.feed .n{font-family:"Archivo Narrow",sans-serif;font-weight:700;text-transform:uppercase;font-size:1rem;letter-spacing:.03em}
.feed .s{display:block;color:var(--on-variant);font-size:.82rem;margin-top:.1rem}
.feed .badge{margin-left:auto}
.tbl{width:100%;border-collapse:collapse;border:1px solid var(--hair)}
.tbl th{text-align:left;padding:.8rem 1rem;background:var(--lowest);border-bottom:1px solid var(--hair);
  font-family:"JetBrains Mono",monospace;font-weight:500;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--outline)}
.tbl td{padding:.95rem 1rem;border-bottom:1px solid var(--hair);font-size:.94rem}
.tbl tr:nth-child(even) td{background:var(--container)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.time{font-family:"JetBrains Mono",monospace;color:var(--neon);white-space:nowrap}
.tbl td.act{text-align:right}
.empty{border:1px dashed var(--hair-s);padding:clamp(1.6rem,4vw,3rem);text-align:center}
.empty b{display:block;font-family:"Archivo Narrow",sans-serif;font-weight:700;text-transform:uppercase;font-size:1.4rem;margin-bottom:.4rem}

/* ==========================================================================
   ÉQUIPE
   ========================================================================== */
.team{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hair);border:1px solid var(--hair)}
.mb{background:var(--container);transition:background .4s var(--e)}
.mb:hover{background:var(--high)}
.mb .ph{position:relative;aspect-ratio:3/4;overflow:hidden}
.mb .ph img{width:100%;height:100%;object-fit:cover;transition:filter .7s var(--e),scale 1.1s var(--e)}
.mb:hover .ph img{filter:brightness(1.25);scale:1.04}
.mb .ph .tag{position:absolute;top:.8rem;left:.8rem}
.mb .tx{padding:1.1rem}
.mb .tx .role{color:var(--neon);display:block;margin-bottom:.45rem}
.mb .tx h3{font-family:"Archivo Narrow",sans-serif;font-weight:700;text-transform:uppercase;font-size:1.25rem;line-height:1.05}
.mb .tx p{color:var(--on-variant);font-size:.9rem;margin-top:.5rem}

"use strict";
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const L=['fr','en','nl','pt'],LC={fr:'fr-FR',en:'en-GB',nl:'nl-NL',pt:'pt-BR'};
let lang='fr',timers=[];
/* ============================================================
   VISUELS ORIGINAUX — dessinés en SVG à partir d'une graine.
   Aucune image externe : ni banque d'images, ni miniature YouTube.
   ~5,5 Ko par visuel, zéro requête réseau, net à toute taille.
   ============================================================ */
const AP={deep:'#0c0f0f',s1:'#121414',s2:'#1a1c1c',s3:'#1e2020',line:'#464932',
  out:'#909378',neon:'#d4f000',dim:'#bad200',orange:'#ff571a',paper:'#e2e2e2'};
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const N=(v,d=1)=>(+v).toFixed(d);

function interlock(cx,cy,r,sw,op,rot){
  const d=r*.6;
  return `<g opacity="${N(op,2)}" fill="none" stroke="${AP.paper}" stroke-width="${N(sw)}" stroke-linecap="round"
     transform="rotate(${N(rot)} ${N(cx)} ${N(cy)})">
    <circle cx="${N(cx-d)}" cy="${N(cy)}" r="${N(r)}"/>
    <path d="M ${N(cx+d+r)} ${N(cy)} A ${N(r)} ${N(r)} 0 0 0 ${N(cx+d)} ${N(cy-r)}"/>
    <path d="M ${N(cx+d)} ${N(cy+r)} A ${N(r)} ${N(r)} 0 0 0 ${N(cx+d+r)} ${N(cy)}"/>
    <path d="M ${N(cx+d)} ${N(cy-r)} A ${N(r)} ${N(r)} 0 0 0 ${N(cx+d-r)} ${N(cy)}
             A ${N(r)} ${N(r)} 0 0 0 ${N(cx+d)} ${N(cy+r)}" opacity=".5"/></g>`;
}
/* tapis en perspective + repères techniques */
function matPersp(cx,cy,rx,ry,ac,ticks){
  let g='',t='';
  for(let i=0;i<8;i++){const k=i/7,y=cy+ry*.5+i*ry*.44;
    g+=`<line x1="${N(cx-rx*(1.5+k*2.2))}" y1="${N(y)}" x2="${N(cx+rx*(1.5+k*2.2))}" y2="${N(y)}" stroke="${AP.line}" stroke-width="1" opacity="${N(.55-k*.42,3)}"/>`}
  if(ticks)for(let i=0;i<24;i++){const a=i/24*Math.PI*2;
    t+=`<line x1="${N(cx+Math.cos(a)*rx)}" y1="${N(cy+Math.sin(a)*ry)}" x2="${N(cx+Math.cos(a)*rx*1.07)}" y2="${N(cy+Math.sin(a)*ry*1.07)}" stroke="${AP.out}" stroke-width="1" opacity=".4"/>`}
  return `<g>${g}
   <ellipse cx="${N(cx)}" cy="${N(cy)}" rx="${N(rx)}" ry="${N(ry)}" fill="${ac}" fill-opacity=".06"/>
   <ellipse cx="${N(cx)}" cy="${N(cy)}" rx="${N(rx)}" ry="${N(ry)}" fill="none" stroke="${AP.out}" stroke-width="1.5" opacity=".6"/>
   <ellipse cx="${N(cx)}" cy="${N(cy)}" rx="${N(rx*.62)}" ry="${N(ry*.62)}" fill="none" stroke="${AP.line}" stroke-width="1.2" opacity=".85"/>
   <path d="M ${N(cx-rx)} ${N(cy)} A ${N(rx)} ${N(ry)} 0 0 1 ${N(cx+rx*.1)} ${N(cy-ry)}" fill="none" stroke="${ac}" stroke-width="2.4" opacity=".75"/>
   ${t}</g>`;
}
/* tapis vu du dessus : cercles concentriques + rayons */
function matTop(cx,cy,r,ac){
  let s='';
  for(let i=0;i<36;i++){const a=i/36*Math.PI*2;
    s+=`<line x1="${N(cx+Math.cos(a)*r*.98)}" y1="${N(cy+Math.sin(a)*r*.98)}" x2="${N(cx+Math.cos(a)*r*1.06)}" y2="${N(cy+Math.sin(a)*r*1.06)}" stroke="${AP.out}" stroke-width="1" opacity=".35"/>`}
  return `<g>
   <circle cx="${N(cx)}" cy="${N(cy)}" r="${N(r)}" fill="${ac}" fill-opacity=".05"/>
   <circle cx="${N(cx)}" cy="${N(cy)}" r="${N(r)}" fill="none" stroke="${AP.out}" stroke-width="1.5" opacity=".55"/>
   <circle cx="${N(cx)}" cy="${N(cy)}" r="${N(r*.66)}" fill="none" stroke="${AP.line}" stroke-width="1.2" opacity=".8"/>
   <circle cx="${N(cx)}" cy="${N(cy)}" r="${N(r*.3)}" fill="none" stroke="${ac}" stroke-width="1.4" opacity=".5"/>
   <path d="M ${N(cx)} ${N(cy-r)} A ${N(r)} ${N(r)} 0 0 1 ${N(cx+r*.72)} ${N(cy-r*.7)}" fill="none" stroke="${ac}" stroke-width="2.6" opacity=".8"/>
   ${s}</g>`;
}
/* motif de tableau : lignes de bracket */
function bracket(x,y,w,h,op){
  let d='';const n=4,step=h/n;
  for(let i=0;i<n;i++){const yy=y+i*step;
    d+=`M ${N(x)} ${N(yy)} h ${N(w*.42)} V ${N(yy+step*.5)} h ${N(w*.3)} `}
  return `<path d="${d}" fill="none" stroke="${AP.out}" stroke-width="1" opacity="${N(op,2)}"/>`;
}
function art(kind,seed){
  const W={poster:600,wide:1600,portrait:600,frame:1280}[kind];
  const H={poster:900,wide:900,portrait:800,frame:720}[kind];
  const r=rng((seed*2654435761)>>>0);
  const pick=r();
  const ac=pick<.18?AP.orange:pick<.34?AP.dim:AP.neon;
  const variant=kind==='frame'?0:Math.floor(r()*3);
  const cx=W*(kind==='wide'?(.56+r()*.2):(.36+r()*.28));
  const cy=H*(variant===2?(.42+r()*.12):(kind==='portrait'?.76:.7));
  const rx=W*(kind==='wide'?.28+r()*.07:.4+r()*.12), ry=rx*(.27+r()*.08);
  const nb=2+Math.floor(r()*3);
  let defs='',beams='';
  for(let i=0;i<nb;i++){
    const bx=W*(.08+r()*.84), bw=W*(.09+r()*.2), sk=(r()-.5), op=.05+r()*.1;
    defs+=`<linearGradient id="b${i}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${AP.paper}" stop-opacity="${N(op,3)}"/>
      <stop offset=".6" stop-color="${AP.paper}" stop-opacity="${N(op*.3,3)}"/>
      <stop offset="1" stop-color="${AP.paper}" stop-opacity="0"/></linearGradient>`;
    beams+=`<polygon points="${N(bx-bw*.14)},0 ${N(bx+bw*.14)},0 ${N(bx+bw*(1.1-sk))},${H} ${N(bx-bw*(1.1+sk))},${H}" fill="url(#b${i})"/>`;
  }
  const body=variant===2
    ? matTop(cx,cy,rx*.78,ac)+interlock(cx,cy+rx*1.05,rx*.3,rx*.06,.42,r()*40-20)
    : matPersp(cx,cy,rx,ry,ac,variant===1)+interlock(cx,cy-ry*(kind==='wide'?1.9:2.5),rx*(.32+r()*.14),rx*.07,.42+r()*.2,r()*30-15);
  const extra=variant===1?bracket(W*.06,H*.12,W*.3,H*.26,.22)
    : variant===0?`<line x1="${N(W*.82)}" y1="0" x2="${N(W*.82)}" y2="${H}" stroke="${ac}" stroke-width="1" opacity=".18"/>`:'';
  /* balayage vidéo : un motif tuilé plutôt que 180 lignes */
  const scanDefs=kind==='frame'?`<pattern id="sc" width="4" height="4" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="4" y2="0" stroke="${AP.paper}" stroke-width="1"/></pattern>`:'';
  const scan=kind==='frame'?`<rect width="${W}" height="${H}" fill="url(#sc)" opacity=".055"/>`:'';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2=".7" y2="1">
   <stop offset="0" stop-color="${AP.s3}"/><stop offset=".5" stop-color="${AP.s1}"/><stop offset="1" stop-color="${AP.deep}"/></linearGradient>
 <radialGradient id="gl" cx="50%" cy="50%" r="50%">
   <stop offset="0" stop-color="${ac}" stop-opacity=".2"/><stop offset="1" stop-color="${ac}" stop-opacity="0"/></radialGradient>
 <radialGradient id="vg" cx="50%" cy="45%" r="64%">
   <stop offset=".4" stop-color="${AP.deep}" stop-opacity="0"/><stop offset="1" stop-color="${AP.deep}" stop-opacity=".94"/></radialGradient>
 <linearGradient id="fl" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="${AP.deep}" stop-opacity="0"/><stop offset="1" stop-color="${AP.deep}" stop-opacity=".97"/></linearGradient>
 ${defs}${scanDefs}</defs>
<rect width="${W}" height="${H}" fill="url(#bg)"/>
<ellipse cx="${N(cx)}" cy="${N(cy-H*.12)}" rx="${N(W*.62)}" ry="${N(H*.4)}" fill="url(#gl)"/>
${beams}${extra}${body}${scan}
<rect width="${W}" height="${H}" fill="url(#vg)"/>
<rect x="0" y="${N(H*.6)}" width="${W}" height="${N(H*.4)}" fill="url(#fl)"/>
<rect x="${N(W*.06)}" y="${N(H*.9)}" width="${N(W*.09)}" height="3" fill="${ac}"/>
</svg>`;
}
const ART=(kind,seed)=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(art(kind,seed));
const hash=str=>{let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};

      <p class="body-lg rv" style="--d:120ms">${esc(lo(e.sum))}</p>
      <div class="acts rv" style="--d:180ms">

    <div class="stat"><span class="lab">${t('f.mats')}</span><b class="mono">${e.mats}</b></div>

      <h2 class="h-md rv" style="margin-bottom:1rem">${t('l.up')}</h2>

let curFeed=null;
function vLive(){
  const ev=EV.find(e=>e.lives.some(l=>l.st==='live'));
  if(!ev)return `<section class="sect wrap"><div class="empty rv"><b>${t('l.none')}</b><p class="dim">${t('l.none2')}</p>
    <a class="btn btn-o" style="margin-top:1.2rem" href="#/events">${t('cta.cal')}</a></div></section>${ctaBand()}`;
  const list=ev.lives;
  if(!curFeed||!list.some(l=>l.id===curFeed))curFeed=(list.find(l=>l.st==='live')||list[0]).id;
  const c=list.find(l=>l.id===curFeed);
  const viewers=(12.4+list.findIndex(l=>l.id===curFeed)*1.3).toFixed(1);
  return `
  <section class="sect wrap">
    <div class="live">
      <div>
        <div class="player rv" data-yt="${c.v}">
          <span class="hud">
            ${c.st==='live'?`<span class="pill pill-live"><i class="dot p"></i>${t('st.live')} · ${esc(lo(c.t))}</span>`
             :`<span class="pill pill-neon">${t('st.sched')} · ${esc(lo(c.t))}</span>`}
            <span class="vw lab">${IC.eye}${viewers}K ${t('l.viewers')}</span>
          </span>
          <video poster="${YT(c.v)}" preload="none" playsinline width="1280" height="720"
            src="${(VID[c.v]||{}).src||''}"></video><span class="go"></span>
          <span class="bar lab">
            <span class="t"><i class="dot p" style="display:inline-block"></i> ${c.st==='live'?'LIVE':'—'}</span>
            <span>${esc(ev.title)}</span>
            <span class="sp">${IC.vol}${IC.cog}${IC.full}</span>
          </span>
        </div>
        ${credit(c.v)}
        <h1 class="h-lg rv" style="--d:60ms;margin:1.2rem 0 .4rem">${esc(lo(c.t))}</h1>
        <p class="dim rv" style="--d:80ms">${esc(ev.title)} · ${esc(ev.venue)}, ${esc(ev.city)} · ${fdRange(ev)}</p>

        <h2 class="h-md rv" style="--d:120ms;margin:var(--stack-md) 0 1rem">${t('l.up')}</h2>
        <table class="tbl rv" style="--d:140ms"><thead><tr><th>${t('l.time')}</th><th>${t('l.cat')}</th><th style="text-align:right">${t('l.act')}</th></tr></thead>
          <tbody>${ev.sched.map(([h,l])=>`<tr><td class="time">${h}</td><td class="cat">${esc(lo(l))}</td>
            <td class="act"><span class="fbtn">${t('l.remind')}</span></td></tr>`).join('')}</tbody></table>
      </div>
      <aside>
        <div class="feeds rv" style="--d:80ms">
          <h3 class="lab dim">${t('l.feeds')}</h3>
          ${list.map(l=>`<button class="feed" data-feed="${l.id}" ${l.id===curFeed?'aria-current="true"':''}>
            <span><span class="n">${esc(lo(l.t))}</span><span class="s">${l.st==='live'?t('st.live'):l.st==='scheduled'?t('st.sched'):t('st.replay')}</span></span>
            <span class="badge">${l.st==='live'?'<span class="pill pill-live"><i class="dot p"></i>LIVE</span>':''}</span></button>`).join('')}
        </div>
        <div class="feeds rv" style="--d:140ms;margin-top:1rem">
          <h3 class="lab dim">${t('f.feat')}</h3>
          <div style="padding:1rem;background:var(--container)">
            <p class="lab dim">${esc(lo(ev.kind))}</p>
            <h4 class="h-md" style="font-size:1.15rem;margin:.4rem 0 .6rem">${esc(ev.title)}</h4>
            <p class="dim" style="font-size:.9rem">${esc(lo(ev.sum))}</p>
            <a class="btn btn-o btn-sm" style="margin-top:1rem" href="#/event/${ev.id}">${t('cta.event')}</a>
          </div>
        </div>
      </aside>
    </div>
  </section>
  ${ctaBand()}`;
}

function vTeam(){
  return `
  <section class="sect wrap">
    <p class="lab rv" style="color:var(--neon)">${t('t.kick')}</p>
    <h1 class="disp rv" style="--d:60ms;margin:.4rem 0 1rem">${t('t.title')}</h1>
    <p class="body-lg rv" style="--d:120ms;max-width:62ch">${t('t.lead')}</p>

const ctaBand=()=>`<section class="cta-band"><div class="wrap in">
  <div><h2 class="h-lg">${t('cta.band')}</h2><p class="body-lg" style="margin-top:.5rem;max-width:52ch">${t('cta.bandd')}</p></div>
  <div style="display:flex;gap:.8rem;flex-wrap:wrap">
    <a class="btn" href="mailto:ase@alfaevenementen.com">${t('ft.contact')}</a>
    <a class="btn btn-o" href="#/events">${t('cta.cal')}</a></div>
</div></section>`;

  $('#foot').innerHTML=`
  <div><a class="brand" href="#/" style="margin-bottom:1rem"><span class="k"><i></i></span><span><b>Alfa</b><span>Sport Evenementen</span></span></a>
    <p class="dim" style="font-size:.92rem;max-width:34ch">${t('ft.aboutd')}</p></div>

    <a href="https://www.youtube.com/@ALFASPORTEVENTS" target="_blank" rel="noopener">YouTube</a>
    <a href="mailto:ase@alfaevenementen.com">ase@alfaevenementen.com</a></div>`;

/* ==========================================================================
   routeur
   ========================================================================== */
function parse(){
  const h=location.hash.replace(/^#/,'')||'/',s=h.split('/').filter(Boolean);
  if(s[0]==='event')return{n:'event',id:s[1]};
  if(s[0]==='events')return{n:'events'};
  if(s[0]==='live')return{n:'live'};
  if(s[0]==='team')return{n:'team'};
  return{n:'home'};
}
function draw(){
  timers.forEach(clearInterval);timers=[];
  const r=parse();
  view.innerHTML=r.n==='events'?vEvents():r.n==='live'?vLive():r.n==='team'?vTeam():r.n==='event'?vEvent(r.id):vHome();
  const cur='#'+(location.hash.replace(/^#/,'')||'/');
  $$('#links a,#mnav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')===cur));
  const sc=document.body.classList.contains('mob')?$('#app'):window;
  sc===window?scrollTo({top:0,behavior:'instant'}):sc.scrollTo({top:0,behavior:'instant'});
  initCd();revealFallback();
}
function paint(){ if(document.startViewTransition&&!RM)document.startViewTransition(draw);else draw() }
addEventListener('hashchange',paint);

/* compte à rebours du bandeau de chiffres */
function initCd(){
  const el=$('#cd');if(!el)return;
  const T0=new Date(el.dataset.target+'T09:00:00').getTime(),p=n=>String(n).padStart(2,'0');
  const tk=()=>{const s=Math.max(0,(T0-Date.now())/1000|0);
    el.textContent=`${p(s/86400|0)}${t('cd.d')} ${p(s%86400/3600|0)}${t('cd.h')} ${p(s%3600/60|0)}${t('cd.m')} ${p(s%60)}${t('cd.s')}`};
  tk();timers.push(setInterval(tk,1000));
}
let io=null;
function revealFallback(){
  if(CSS.supports('animation-timeline','view()'))return;
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});
  $$('.rv').forEach(el=>io.observe(el));
}

/* interactions déléguées */
view.addEventListener('click',ev=>{
  const f=ev.target.closest('.fbtn[data-f]');
  if(f){filt[f.dataset.f]=f.dataset.v;draw();return}
  const fd2=ev.target.closest('[data-feed]');
  if(fd2){curFeed=fd2.dataset.feed;draw();return}
  const p=ev.target.closest('.player[data-vid]');
  if(p&&!p.classList.contains('on')){
    const v=p.querySelector('video');
    if(v&&v.src){p.classList.add('on');v.controls=true;v.play().catch(()=>{})}
    return}
});
view.addEventListener('submit',ev=>{
  const f=ev.target.closest('#nlf');if(!f)return;ev.preventDefault();
  f.outerHTML=`<p class="ok">✓ ${t('nl.ok')}</p>`;
});
/* aucun repli nécessaire : les visuels sont générés localement */

/* menu mobile, langue, aperçu */
$('#burger').onclick=()=>$('#mnav').classList.toggle('open');
$$('#mnav a').forEach(a=>a.onclick=()=>$('#mnav').classList.remove('open'));
$('#lang').addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;
  lang=b.dataset.l;document.documentElement.lang=lang;
  $$('#lang button').forEach(x=>x.setAttribute('aria-current',String(x===b)));
  const go=()=>{$$('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));draw();paintFoot()};
  if(document.startViewTransition&&!RM)document.startViewTransition(go);else go();
});
$('#mD').onclick=()=>mode(false);$('#mM').onclick=()=>mode(true);
function mode(m){document.body.classList.toggle('mob',m);
  $('#mD').setAttribute('aria-pressed',String(!m));$('#mM').setAttribute('aria-pressed',String(m));
  scrollTo(0,0);$('#app').scrollTop=0}

$$('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
paintFoot();draw();
})();
</script>
</html>

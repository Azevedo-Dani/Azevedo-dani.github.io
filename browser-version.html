<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informations Navigateur</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
            text-align: center;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 100%;
        }
        h1 {
            color: #333;
            font-size: 2em;
            margin-bottom: 20px;
        }
        h2 {
            color: #555;
            margin-top: 30px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        p, pre {
            font-size: 1.2em;
            color: #666;
            margin-top: 0;
            text-align: left;
            word-wrap: break-word;
        }
        strong {
            color: #333;
        }
        pre {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
        .highlight {
            background-color: #fff8e1;
            border-left: 5px solid #ffb300;
            padding: 10px 15px;
            margin-bottom: 10px;
        }
        .unavailable {
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Informations sur le Navigateur</h1>
    <p id="status">Récupération des informations...</p>

    <div id="result">
        </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var resultElement = document.getElementById('result');
        var statusElement = document.getElementById('status');

        // Renseigné en asynchrone par les API TV : le navigateur ne connaît que son
        // propre plan graphique, jamais la résolution réelle de la dalle.
        var panel = {
            source: null,
            resolution: null,
            model: null,
            firmware: null,
            error: null
        };

        // Fonction pour détecter le navigateur et sa version
        function getBrowserInfo() {
            var ua = navigator.userAgent;
            var tem;
            var M = ua.match(/(opera|chrome|safari|firefox|msie|trident(?=\/))\/?\s*(\d+(\.\d+)?)/i) || [];
            if(/trident/i.test(M[1])){
                tem = /\brv[ :]+(\d+(\.\d+)?)/g.exec(ua) || [];
                return 'IE '+(tem[1] || '');
            }
            if(M[1] === 'Chrome'){
                tem = ua.match(/\b(OPR|Edge)\/(\d+(\.\d+)?)/);
                if(tem != null) return tem.slice(1).join(' ').replace('OPR', 'Opera');
            }
            M = M[2]? [M[1], M[2]]: [navigator.appName, navigator.appVersion, '-?'];
            if((tem=ua.match(/version\/(\d+(\.\d+)?)/i))!=null) M.splice(1, 1, tem[1]);
            return M.join(' ');
        }

        // Résolution physique de l'écran, taille utile de la fenêtre, et densité
        function getScreenInfo() {
            var s = window.screen || {};
            return {
                screen: (s.width || '?') + ' x ' + (s.height || '?'),
                available: (s.availWidth || '?') + ' x ' + (s.availHeight || '?'),
                viewport: window.innerWidth + ' x ' + window.innerHeight,
                colorDepth: (s.colorDepth || '?') + ' bits',
                pixelRatio: window.devicePixelRatio || 1,
                orientation: (s.orientation && s.orientation.type) || (window.innerWidth >= window.innerHeight ? 'landscape' : 'portrait')
            };
        }

        // FlowR fixe la police racine à 8 * (max(largeur, hauteur) / 1920) px :
        // c'est la valeur qui donne l'équivalence px <-> rem sur cet écran.
        function getFlowrRemBase(viewportWidth, viewportHeight) {
            return 8 * (Math.max(viewportWidth, viewportHeight) / 1920);
        }

        function parseResolution(text) {
            var match = /(\d+)\s*[xX*]\s*(\d+)/.exec(String(text || ''));
            return match ? { width: parseInt(match[1], 10), height: parseInt(match[2], 10) } : null;
        }

        // Rapport entre la dalle et le plan graphique : c'est ce facteur que le
        // scaler de la TV applique, et donc ce qui rend l'interface molle.
        function getUpscaleFactor() {
            var dalle = parseResolution(panel.resolution);
            if (!dalle || !window.innerWidth) {
                return null;
            }
            return (dalle.width / window.innerWidth).toFixed(2);
        }

        function readHcapProperty(key, done) {
            try {
                hcap.property.getProperty({
                    key: key,
                    onSuccess: function(success) { done(success.value); },
                    onFailure: function(error) { done(null, error && error.errorMessage); }
                });
            } catch (e) {
                done(null, e && e.message);
            }
        }

        // LG hospitality : hcap est injecté par le conteneur Pro:Centric.
        function readPanelFromHcap(done) {
            var pending = 3;
            var settle = function() {
                pending -= 1;
                if (pending === 0) { done(); }
            };

            panel.source = 'HCAP (LG hospitality)';
            readHcapProperty('display_resolution', function(value, error) {
                panel.resolution = value;
                if (error) { panel.error = error; }
                settle();
            });
            readHcapProperty('model_name', function(value) { panel.model = value; settle(); });
            readHcapProperty('platform_version', function(value) { panel.firmware = value; settle(); });
        }

        // webOS TV / signage : screenWidth et screenHeight de deviceInfo décrivent la dalle.
        function readPanelFromWebos(done) {
            panel.source = 'webOSTV deviceInfo';
            try {
                window.webOS.deviceInfo(function(device) {
                    if (device && device.screenWidth) {
                        panel.resolution = device.screenWidth + ' x ' + device.screenHeight;
                    }
                    panel.model = device && device.modelName;
                    panel.firmware = device && device.version;
                    done();
                });
            } catch (e) {
                panel.error = e && e.message;
                done();
            }
        }

        function readPanel(done) {
            var finished = false;
            var finish = function() {
                if (!finished) { finished = true; done(); }
            };

            // Une API TV qui ne rappelle jamais laisserait la page bloquée sur "Récupération...".
            setTimeout(finish, 3000);

            if (typeof hcap !== 'undefined' && hcap.property && hcap.property.getProperty) {
                readPanelFromHcap(finish);
            } else if (window.webOS && window.webOS.deviceInfo) {
                readPanelFromWebos(finish);
            } else {
                finish();
            }
        }

        function renderPanelSection() {
            if (!panel.source) {
                return '<h2>Résolution de l\'écran (dalle) :</h2>' +
                    '<p class="unavailable">Aucune API TV détectée (ni hcap, ni webOSTV) — page ouverte hors du conteneur TV. ' +
                    'Seul le plan graphique ci-dessous est mesurable.</p>';
            }

            var upscale = getUpscaleFactor();
            var html = '<h2>Résolution de l\'écran (dalle) :</h2>';

            if (panel.resolution) {
                html += '<p class="highlight"><strong>Résolution de l\'écran :</strong> ' + panel.resolution +
                    '&nbsp;&nbsp;<small>(source : ' + panel.source + ')</small></p>';
            } else {
                html += '<p class="unavailable">Résolution non retournée par ' + panel.source +
                    (panel.error ? ' — ' + panel.error : '') + '</p>';
            }

            if (upscale) {
                html += '<p><strong>Facteur d\'upscale appliqué par la TV :</strong> x' + upscale +
                    ' (dalle ÷ plan graphique de l\'app)</p>';
            }
            if (panel.model) {
                html += '<p><strong>Modèle :</strong> ' + panel.model + '</p>';
            }
            if (panel.firmware) {
                html += '<p><strong>Firmware :</strong> ' + panel.firmware + '</p>';
            }

            return html;
        }

        function refresh() {
            var browserInfo = getBrowserInfo();
            var platform = navigator.platform || 'Non spécifié';
            var userAgentString = navigator.userAgent || 'Non spécifié';
            var screenInfo = getScreenInfo();
            var remBase = getFlowrRemBase(window.innerWidth, window.innerHeight);

            statusElement.textContent = 'Informations récupérées.';

            resultElement.innerHTML =
                renderPanelSection() +
                '<h2>Plan graphique de l\'app (navigateur) :</h2>' +
                '<p><strong>screen :</strong> ' + screenInfo.screen + '</p>' +
                '<p><strong>Zone disponible :</strong> ' + screenInfo.available + '</p>' +
                '<p><strong>Fenêtre (viewport CSS) :</strong> ' + screenInfo.viewport + '</p>' +
                '<p><strong>Device pixel ratio :</strong> ' + screenInfo.pixelRatio + '</p>' +
                '<p><strong>Profondeur de couleur :</strong> ' + screenInfo.colorDepth + '</p>' +
                '<p><strong>Orientation :</strong> ' + screenInfo.orientation + '</p>' +
                '<h2>Base rem FlowR sur cet écran :</h2>' +
                '<p><strong>1rem =</strong> ' + remBase.toFixed(2) + 'px &nbsp;&nbsp; (<strong>1px =</strong> ' + (1 / remBase).toFixed(4) + 'rem)</p>' +
                '<h2>Détails du navigateur :</h2>' +
                '<p><strong>Navigateur et version :</strong> ' + browserInfo + '</p>' +
                '<p><strong>Système d\'exploitation :</strong> ' + platform + '</p>' +
                '<h2>Chaîne complète (User-Agent) :</h2>' +
                '<pre>' + userAgentString + '</pre>';
        }

        refresh();
        readPanel(refresh);
        window.addEventListener('resize', refresh);
    });
</script>

</body>
</html>
